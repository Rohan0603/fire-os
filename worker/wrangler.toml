name = "fire-os-assistant"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[vars]
# Comma-separated CORS allowlist. Must cover every host the UI is served from:
# firebaseapp.com, web.app, the local dev server, and the Cloudflare Workers domain
# added when hosting moves off Firebase (see docs/CHANGELOG.md).
ALLOWED_ORIGIN = "https://fire-os-dd6d6.firebaseapp.com,https://fire-os-dd6d6.web.app,http://localhost:5173,http://127.0.0.1:5173"
OPENROUTER_HTTP_REFERER = "https://fire-os-dd6d6.web.app"

[secrets]
required = ["OPENROUTER_API_KEY"]

[[ratelimits]]
name = "ASSISTANT_RATE_LIMITER"
# Account-scoped namespace ID reserved for the FIRE OS assistant.
namespace_id = "4029617281"

  [ratelimits.simple]
  limit = 20
  period = 60
