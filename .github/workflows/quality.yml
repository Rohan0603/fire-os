name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Assistant Worker tests
        run: npm run test:worker

      - name: Personal identifier guard
        run: npm run test:privacy

      - name: Firestore rules tests
        run: npm run test:rules:emulator

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Most E2E specs assert the supported local-only guest mode. Do not
      # inject Firebase configuration into those runs: that forces the
      # signed-out auth gate and hides the routes the specs verify.
      - name: Browser E2E tests (guest mode)
        run: npx playwright test --grep-invert "auth screen with Firebase configured"

      # Auth specs separately verify the configured Firebase sign-in controls.
      # Starting a fresh Playwright server ensures this mode cannot leak into
      # the guest-mode tests. Both suites must pass.
      - name: Browser E2E tests (configured Firebase auth)
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npx playwright test e2e/auth.spec.ts
