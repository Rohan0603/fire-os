name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install assistant server dependencies
        run: npm ci --prefix server

      - name: Build
        run: npm run build
        env:
          VITE_CORSPROXY_API_KEY: ${{ secrets.VITE_CORSPROXY_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Verify generated route metadata
        run: npm run test:metadata

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Assistant proxy tests
        run: npm run test:server

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser guest-route tests
        run: npm run test:e2e

      - name: Validate Firestore rules
        run: npm run test:rules:emulator

      # Requires the OPENROUTER_API_KEY secret to be provisioned once:
      #   firebase functions:secrets:set OPENROUTER_API_KEY
      - name: Deploy to Firebase
        run: npx --no-install firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project fire-os-dd6d6 --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Post-deploy route smoke test
        run: node scripts/smoke-routes.mjs
        env:
          SMOKE_BASE_URL: https://fire-os-dd6d6.web.app
